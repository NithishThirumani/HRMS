services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html/emps
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: hrms_secret
      DB_NAME: EMPS

  db:
    image: mariadb:10.4
    environment:
      MYSQL_ROOT_PASSWORD: hrms_secret
      MYSQL_DATABASE: EMPS
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/emps.sql:/docker-entrypoint-initdb.d/01-emps.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

volumes:
  db_data:
